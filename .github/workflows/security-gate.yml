# security-gate: makes "agent-review/security is required when it applies" enforceable.
#
# A ruleset can only require a status unconditionally, so the ruleset always requires
# `agent-review/security`, and this workflow decides whether it is needed:
#   * required     -> posts `pending` (no verdict yet); security-reviewer later posts success/failure.
#   * not required -> posts `success` with the description "not required".
# Required when the PR has the `security` label OR its diff touches a trust-boundary path (list below).
# On a path match the workflow also adds the `security` label, but the decision never relies on the label
# alone: removing the label cannot turn a path-matched PR into "not required".
#
# It never overwrites a verdict. It only posts when the newest `agent-review/security` status on the head SHA
# is absent or was posted by this workflow (creator github-actions[bot] AND the exact description strings
# below). A failure/error, or a success from anyone else, is left alone. Statuses are re-read right before
# posting to narrow the race window.
#
# WHAT THIS GATE IS NOT (read this before relying on it)
#  * It is NOT tamper-proof. With the `pull_request` trigger the workflow that runs is the one on the PR's head
#    branch, so a PR can modify its own gate, and a PR could add a workflow with `statuses: write` that forges
#    ANY status (including agent-review/*). The `.github/**` path match below only catches honest mistakes.
#  * The actual backstop today is procedural: a human approves each `gh pr merge`, and the tech-lead rule is that
#    any PR touching `.github/**` or this file gets security-reviewer and a human flag. This is an accepted risk,
#    tracked as Q2 on the board (docs/tasks/M0.md). Agents also share one gh identity, so they could forge
#    agent-review/* statuses by hand.
#  * scripts/setup-branch-protection.sh pins this workflow with a ruleset "require workflows" rule only when the
#    repo is organization-owned; on a user-owned repo that hardening is unavailable.
#  * Fork PRs get a read-only token, so the status cannot be posted and the PR stays blocked (fail-closed).
#
# STATUSES ARE PER COMMIT, NOT PER PR. Two open PRs can share one head SHA, so "not required" is posted only when
# EVERY open PR into dev/main with this head SHA is not-required. The workflow runs only for PRs into dev/main
# (`branches` filter plus an explicit base check); PRs with any other base are ignored.
#
# Trigger is `pull_request` only: never pull_request_target. No secrets are used.
name: security-gate

on:
  pull_request:
    branches: [dev, main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, edited]

permissions:
  statuses: write
  pull-requests: write
  contents: read

concurrency:
  group: security-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const CONTEXT = 'agent-review/security';
            const OWN_LOGIN = 'github-actions[bot]';
            const DESC_REQUIRED = 'security review required: awaiting agent-review/security verdict';
            const DESC_NOT_REQUIRED = 'not required';
            const BASES = ['dev', 'main'];

            // Trust-boundary paths. Directory prefixes end with '/'; the rest are exact paths.
            const DIR_PREFIXES = [
              'supabase/functions/', 'supabase/migrations/', 'backend/app/api/', 'backend/app/db/',
              'backend/app/ingest/', 'backend/app/meta/', 'prompts/', 'evals/',
              '.github/', 'scripts/', 'fixtures/', '.claude/',
            ];
            const EXACT = new Set([
              'supabase/config.toml', 'supabase/seed.sql', 'backend/app/serve.py', 'backend/app/config.py',
              'backend/app/enrich/title.py', '.env.example', '.gitignore', '.gitleaks.toml', '.gitleaksignore',
              '.pre-commit-config.yaml', 'Makefile', 'backend/pyproject.toml', 'frontend/package.json',
            ]);
            const LOCKFILE = /(^|\/)(uv\.lock|package-lock\.json|pnpm-lock\.yaml|yarn\.lock|poetry\.lock|Pipfile\.lock|deno\.lock|bun\.lockb?|npm-shrinkwrap\.json|requirements[^/]*\.txt)$/;
            const ENVFILE = /(^|\/)\.env/; // any env-file pattern at any depth (.env, .env.local, .envrc, ...)
            const isBoundary = (p) =>
              EXACT.has(p) || DIR_PREFIXES.some((d) => p.startsWith(d)) || LOCKFILE.test(p) || ENVFILE.test(p);

            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;

            // Is PR <n> subject to the security review? Reads live state from the API, never the event payload.
            // Fails closed: if the file list is truncated (GitHub caps it at 3000), the PR is treated as required.
            const assess = async (n) => {
              const { data: p } = await github.rest.pulls.get({ owner, repo, pull_number: n });
              const labels = p.labels.map((l) => l.name);
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: n, per_page: 100,
              });
              const touched = files.flatMap((f) => [f.filename, f.previous_filename].filter(Boolean));
              const matched = touched.filter(isBoundary);
              const truncated = files.length < p.changed_files;
              const required = labels.includes('security') || matched.length > 0 || truncated;
              core.info(`PR #${n} base=${p.base.ref} head=${p.head.sha} labels=[${labels}] files=${files.length}/${p.changed_files} boundaryFiles=${matched.length} truncated=${truncated} required=${required}`);
              return { pr: p, labels, matched, required };
            };

            const mine = await assess(number);
            const pr = mine.pr;
            if (!BASES.includes(pr.base.ref)) {
              core.info(`Base '${pr.base.ref}' is not dev/main: this gate does not apply, posting nothing.`);
              return;
            }
            const sha = pr.head.sha;

            if (mine.matched.length > 0 && !mine.labels.includes('security')) {
              try {
                await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['security'] });
              } catch (e) {
                core.warning(`could not add the security label: ${e.message}`);
              }
            }

            // Statuses belong to the commit, not the PR. Every other open PR into dev/main that shares this head SHA
            // must also be not-required before we may post `success`.
            let required = mine.required;
            if (!required) {
              const assoc = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                owner, repo, commit_sha: sha, per_page: 100,
              });
              for (const a of assoc) {
                if (a.number === number || a.state !== 'open' || !BASES.includes(a.base.ref)) continue;
                const other = await assess(a.number);
                if (other.required) {
                  core.info(`Sibling PR #${a.number} shares head ${sha} and requires security review: keeping the gate pending.`);
                  required = true;
                  break;
                }
              }
            }
            core.info(`final: head=${sha} required=${required}`);

            // Newest agent-review/security status on the head SHA (the list is newest first). Fully paginated.
            const latest = async () => {
              const list = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
                owner, repo, ref: sha, per_page: 100,
              });
              return list.find((s) => s.context === CONTEXT);
            };
            const isOwn = (s) =>
              s.creator?.login === OWN_LOGIN &&
              (s.description === DESC_REQUIRED || s.description === DESC_NOT_REQUIRED);

            const want = required
              ? { state: 'pending', description: DESC_REQUIRED }
              : { state: 'success', description: DESC_NOT_REQUIRED };

            // Decide from the newest status; returns true when it is safe to post `want`.
            const mayPost = (cur) => {
              if (!cur) return true;
              if (!isOwn(cur)) return false; // someone else's verdict (or pending): never touch
              return !(cur.state === want.state && cur.description === want.description);
            };

            if (!mayPost(await latest())) {
              core.info('Existing status is a verdict from someone else, or already correct: nothing to post.');
              return;
            }
            // Re-read immediately before posting.
            if (!mayPost(await latest())) {
              core.info('Status changed while running: nothing to post.');
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner, repo, sha, context: CONTEXT, state: want.state, description: want.description,
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });
            core.info(`Posted ${CONTEXT}=${want.state} (${want.description})`);
