# PR checks: ci/lint, ci/typecheck, ci/test, ci/secrets.
# Each job reports success (and skips its real work) while its area does not exist yet.
# ci/test excludes tests/db: those need a running database and run in ci/migrations (added in M0.6).
# Trigger is `pull_request` (never pull_request_target): fork PRs get no secrets. No secrets are used here.
name: pr-checks

on:
  pull_request:
    branches: [dev, main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: ci/lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect areas
        id: area
        run: |
          [ -f backend/pyproject.toml ] && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          [ -d supabase/functions ] && echo "functions=true" >> "$GITHUB_OUTPUT" || echo "functions=false" >> "$GITHUB_OUTPUT"
          [ -f frontend/package.json ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.area.outputs.backend == 'true'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: steps.area.outputs.functions == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.area.outputs.frontend == 'true'
        with:
          node-version: 22
      - name: Install backend deps
        if: steps.area.outputs.backend == 'true'
        run: cd backend && uv sync
      - name: Install frontend deps
        if: steps.area.outputs.frontend == 'true'
        run: cd frontend && npm ci
      - name: Lint
        run: make lint

  typecheck:
    name: ci/typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect areas
        id: area
        run: |
          [ -f backend/pyproject.toml ] && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          [ -n "$(find supabase/functions -name '*.ts' -not -path '*/node_modules/*' 2>/dev/null | head -1)" ] && echo "functions=true" >> "$GITHUB_OUTPUT" || echo "functions=false" >> "$GITHUB_OUTPUT"
          [ -f frontend/package.json ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.area.outputs.backend == 'true'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: steps.area.outputs.functions == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.area.outputs.frontend == 'true'
        with:
          node-version: 22
      - name: mypy (backend)
        if: steps.area.outputs.backend == 'true'
        run: cd backend && uv sync && uv run mypy app
      - name: deno check (edge functions)
        if: steps.area.outputs.functions == 'true'
        run: find supabase/functions -name 'index.ts' -not -path '*/node_modules/*' -print0 | xargs -0 -r deno check
      - name: tsc (frontend)
        if: steps.area.outputs.frontend == 'true'
        run: cd frontend && npm ci && npm run typecheck --if-present
      - name: Nothing to check yet
        if: steps.area.outputs.backend != 'true' && steps.area.outputs.functions != 'true' && steps.area.outputs.frontend != 'true'
        run: echo "No typed code yet, skipping."

  test:
    name: ci/test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect areas
        id: area
        run: |
          [ -f backend/pyproject.toml ] && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          [ -n "$(find supabase/functions -name '*test*.ts' 2>/dev/null | head -1)" ] && echo "functions=true" >> "$GITHUB_OUTPUT" || echo "functions=false" >> "$GITHUB_OUTPUT"
          [ -f frontend/package.json ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.area.outputs.backend == 'true'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: steps.area.outputs.functions == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.area.outputs.frontend == 'true'
        with:
          node-version: 22
      - name: Python tests (tests/db excluded)
        if: steps.area.outputs.backend == 'true'
        run: cd backend && uv sync && uv run pytest --ignore=tests/db ../tests
      - name: Deno tests (edge functions)
        if: steps.area.outputs.functions == 'true'
        run: deno test --no-check supabase/functions
      - name: Frontend tests
        if: steps.area.outputs.frontend == 'true'
        run: cd frontend && npm ci && npm test --if-present
      - name: Nothing to test yet
        if: steps.area.outputs.backend != 'true' && steps.area.outputs.functions != 'true' && steps.area.outputs.frontend != 'true'
        run: echo "No testable code yet, skipping."

  secrets:
    name: ci/secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The gitleaks CLI is used directly (the gitleaks-action has a commercial licence). Tarball is verified by sha256.
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gl" && tar -xzf gitleaks.tgz -C "$RUNNER_TEMP/gl" gitleaks
          rm gitleaks.tgz
      - name: Scan history
        run: '"$RUNNER_TEMP/gl/gitleaks" detect --source . --redact --no-banner --verbose'
