# ci/source-branch: PRs into main may only come from dev, release/* or hotfix/*.
# Trigger is `pull_request` (never pull_request_target). The branch name is passed via env, not interpolated into the script.
name: source-branch

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions: {}

jobs:
  source-branch:
    name: ci/source-branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check head branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "PRs into main must come from this repository, not a fork ($HEAD_REPO)."; exit 1
          fi
          case "$HEAD_REF" in
            dev|release/*|hotfix/*) echo "OK: $HEAD_REF -> main" ;;
            *) echo "PRs into main must come from dev, release/* or hotfix/* (got '$HEAD_REF')."; exit 1 ;;
          esac
