version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [area:devops, security]
    commit-message:
      prefix: "chore(devops)"
  # The ecosystems below start producing PRs once the manifests exist (M0.3+).
  - package-ecosystem: uv
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [area:devops]
    commit-message:
      prefix: "chore(devops)"
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [area:devops]
    commit-message:
      prefix: "chore(devops)"
